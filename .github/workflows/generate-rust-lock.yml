name: generate-rust-lock

on:
  workflow_dispatch:
  push:
    branches:
      - mainnet-sbf-shell
    paths:
      - Cargo.toml
      - Cargo.lock
      - programs/levplay-core/**
      - programs/levplay-sbf/**
      - .github/workflows/generate-rust-lock.yml

permissions:
  contents: read

jobs:
  lock-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Test workspace
        run: cargo test --workspace
      - name: Emit generated lock for review
        shell: bash
        run: |
          echo "LEVPLAY_CARGO_LOCK_BEGIN"
          base64 -w 0 Cargo.lock
          echo
          echo "LEVPLAY_CARGO_LOCK_END"

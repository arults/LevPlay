name: generate-token-lock

on:
  push:
    branches:
      - mainnet-token-validation
    paths:
      - Cargo.toml
      - Cargo.lock
      - programs/levplay-sbf/Cargo.toml
      - .github/workflows/generate-token-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22
        with:
          toolchain: 1.85.0
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Test workspace
        run: cargo test --workspace
      - name: Emit generated lock for review
        shell: bash
        run: |
          echo "LEVPLAY_CARGO_LOCK_BEGIN"
          base64 -w 0 Cargo.lock
          echo
          echo "LEVPLAY_CARGO_LOCK_END"

name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@3230091d7ef9483f601620abacc570c22cf44d22
        with:
          toolchain: 1.85.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:protocol
      - run: pnpm test:risk
      - run: pnpm test:backing
      - run: pnpm test:venue
      - run: pnpm test:products
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: pnpm test:security
      - run: pnpm test:http-safety
      - run: pnpm test:ui
      - run: pnpm test:audit-package
      - run: pnpm test:release-evidence
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
